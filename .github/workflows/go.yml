name: Go

on:
  push:
    branches: [ master, parity ]
  pull_request:
    branches: [ master, parity ]

jobs:
  unit:
    name: unit (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [ '1.21', 'stable' ]
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Fetch Aeron 1.53.3 jar for systests
      run: scripts/fetch-aeron-jar.sh

    - name: Build
      run: go build -v ./...

    - name: Vet
      # unsafeptr/unreachable are pre-existing in aeron/util, flyweight, atomic, logbuffer and archive/control.go
      run: go vet -unsafeptr=false -unreachable=false ./...

    - name: Test
      env:
        AERON_SYSTESTS_REQUIRED: '1'
      run: go test -count=1 ./...

  race:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Race tests (core packages)
      run: make race

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Docker Hub rate limits anonymous pulls on shared runners; use Google's mirror.
      JAVA_IMAGE: mirror.gcr.io/library/eclipse-temurin:21-jre
      GO_IMAGE: mirror.gcr.io/library/golang:1.21-bookworm
      RUNTIME_IMAGE: mirror.gcr.io/library/debian:bookworm-slim
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Fetch Aeron 1.53.3 jar for systests
      run: scripts/fetch-aeron-jar.sh

    - name: AERON_E2E=1 tests against the docker Java 1.53.3 archiving driver
      env:
        AERON_SYSTESTS_REQUIRED: '1'
      run: make e2e

    - name: Go clients in containers (compose profile e2e)
      run: make e2e-docker

    - name: Driver logs on failure
      if: failure()
      run: docker compose -f docker/docker-compose.yml --profile e2e logs --no-color || true
