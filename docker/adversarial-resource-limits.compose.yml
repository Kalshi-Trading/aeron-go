# Java Aeron 1.53.3 stacks for the adversarial resource-limit tests in systests/adversarial/resource-limits
# (AERON_E2E=1 AERON_ADVERSARIAL=1). The tests kill, pause and restart these containers, so they are not shared
# with any other suite. Ports are in 27900-27999, stream ids in 9900-9999.
#
#   rl-driver       MediaDriver, AERON_DIR=/dev/shm/aeron-adv-resource-limits (killed/paused by the tests). It uses
#                   SHARED_NETWORK, not SHARED: in SHARED mode the 1.53.3 conductor deadlocks when more than 1024 logs
#                   (CMD_QUEUE_CAPACITY) reach end of life in one timer pass, because it spins offering freeLogBuffer to
#                   the native resource agent that runs on its own thread (DriverConductor.checkManagedResources).
#   rl-driver-b     second MediaDriver, AERON_DIR=/dev/shm/aeron-adv-resource-limits-b (remote receivers)
#   rl-archive      standalone Archive on rl-driver: control localhost:27910 stream 10, events 27911, archive id 99.
#                   It records to a 24MiB tmpfs so the tests can fill the disk.
#   rl-shm-driver   MediaDriver with its own 64MiB /dev/shm (ipc: shareable); clients run in containers that join
#                   its IPC namespace so the aeron dir fills up when the driver creates log buffers.
#   rl-tiny-driver  MediaDriver at /dev/shm/aeron-adv-resource-limits-tiny with the minimum 1MiB counters buffer (8192
#                   counters, so the tests can exhaust it).
#
#   docker compose -p adv-resource-limits -f docker/adversarial-resource-limits.compose.yml up -d --build --wait
name: adv-resource-limits
x-driver: &driver
  build: .
  image: docker-archiving-driver
  network_mode: host
  user: "${UID:-1000}:${GID:-1000}"
  ipc: host
  volumes:
    - /dev/shm:/dev/shm
  command: ["io.aeron.driver.MediaDriver"]

services:
  rl-driver:
    <<: *driver
    container_name: adv-rl-driver
    environment:
      AERON_PROPS: >-
        -Daeron.dir=/dev/shm/aeron-adv-resource-limits
        -Daeron.dir.delete.on.start=true
        -Daeron.client.liveness.timeout=3000000000
        -Daeron.image.liveness.timeout=3000000000
        -Daeron.publication.unblock.timeout=4000000000
        -Daeron.publication.connection.timeout=2000000000
        -Daeron.timer.interval=100000000
        -Daeron.untethered.window.limit.timeout=1000000000
        -Daeron.untethered.resting.timeout=1000000000
        -Daeron.min.flow.control.receiver.timeout=2000000000
        -Daeron.publication.linger.timeout=1000000000
        -Daeron.threading.mode=SHARED_NETWORK
    healthcheck:
      test: ["CMD", "test", "-f", "/dev/shm/aeron-adv-resource-limits/cnc.dat"]
      interval: 1s
      retries: 30

  rl-driver-b:
    <<: *driver
    container_name: adv-rl-driver-b
    environment:
      AERON_PROPS: >-
        -Daeron.dir=/dev/shm/aeron-adv-resource-limits-b
        -Daeron.dir.delete.on.start=true
        -Daeron.client.liveness.timeout=3000000000
        -Daeron.image.liveness.timeout=3000000000
        -Daeron.timer.interval=100000000
        -Daeron.threading.mode=SHARED
    healthcheck:
      test: ["CMD", "test", "-f", "/dev/shm/aeron-adv-resource-limits-b/cnc.dat"]
      interval: 1s
      retries: 30

  rl-archive:
    image: docker-archiving-driver
    container_name: adv-rl-archive
    network_mode: host
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    volumes:
      - /dev/shm:/dev/shm
    tmpfs:
      - /tmp/mark:uid=1000,gid=1000
      - /data/archive:uid=1000,gid=1000,size=24m
    depends_on:
      rl-driver:
        condition: service_healthy
    environment:
      AERON_PROPS: >-
        -Daeron.dir=/dev/shm/aeron-adv-resource-limits
        -Daeron.driver.timeout=3000
        -Daeron.archive.dir=/data/archive/rec
        -Daeron.archive.mark.file.dir=/tmp/mark
        -Daeron.archive.segment.file.length=1m
        -Daeron.archive.low.storage.space.threshold=2m
        -Daeron.archive.control.channel=aeron:udp?endpoint=localhost:27910
        -Daeron.archive.control.stream.id=10
        -Daeron.archive.replication.channel=aeron:udp?endpoint=localhost:0
        -Daeron.archive.recording.events.enabled=true
        -Daeron.archive.recording.events.channel=aeron:udp?control-mode=dynamic|control=localhost:27911
        -Daeron.archive.id=99
        -Daeron.archive.threading.mode=SHARED
    command: ["io.aeron.archive.Archive"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/mark/archive-mark.dat"]
      interval: 1s
      retries: 30

  rl-shm-driver:
    image: docker-archiving-driver
    container_name: adv-rl-shm-driver
    network_mode: host
    user: "${UID:-1000}:${GID:-1000}"
    ipc: shareable
    shm_size: 64m
    environment:
      AERON_PROPS: >-
        -Daeron.dir=/dev/shm/aeron-adv-resource-limits-shm
        -Daeron.dir.delete.on.start=true
        -Daeron.client.liveness.timeout=3000000000
        -Daeron.term.buffer.sparse.file=false
        -Daeron.counters.buffer.length=1048576
        -Daeron.threading.mode=SHARED
    command: ["io.aeron.driver.MediaDriver"]
    healthcheck:
      test: ["CMD", "test", "-f", "/dev/shm/aeron-adv-resource-limits-shm/cnc.dat"]
      interval: 1s
      retries: 30

  rl-tiny-driver:
    <<: *driver
    container_name: adv-rl-tiny-driver
    environment:
      AERON_PROPS: >-
        -Daeron.dir=/dev/shm/aeron-adv-resource-limits-tiny
        -Daeron.dir.delete.on.start=true
        -Daeron.counters.buffer.length=1048576
        -Daeron.client.liveness.timeout=3000000000
        -Daeron.threading.mode=SHARED
    healthcheck:
      test: ["CMD", "test", "-f", "/dev/shm/aeron-adv-resource-limits-tiny/cnc.dat"]
      interval: 1s
      retries: 30
