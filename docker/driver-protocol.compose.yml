# A second Java 1.53.3 media driver that ALLOWS termination via the TERMINATE_DRIVER command, used by
# aeron/driver TestE2ETerminateDriver. It uses its own aeron dir so the shared archiving-driver is unaffected.
#
#   docker compose -f docker/driver-protocol.compose.yml up -d terminable-driver   (add --build if the docker-archiving-driver image is not built yet)
#   AERON_E2E=1 AERON_TERMINATE_DIR=/dev/shm/aeron-terminable go test ./aeron/driver/ -run E2ETerminate -v
services:
  terminable-driver:
    image: docker-archiving-driver
    build: .
    network_mode: host
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    restart: "no"
    volumes:
      - /dev/shm:/dev/shm
    environment:
      AERON_PROPS: >-
        -Daeron.dir=/dev/shm/aeron-terminable
        -Daeron.dir.delete.on.start=true
        -Daeron.dir.delete.on.shutdown=true
        -Daeron.driver.termination.validator=io.aeron.driver.DefaultAllowTerminationValidator
        -Daeron.threading.mode=SHARED
    command: ["io.aeron.driver.MediaDriver"]
    healthcheck:
      test: ["CMD", "test", "-f", "/dev/shm/aeron-terminable/cnc.dat"]
      interval: 1s
      retries: 30
