# Java Aeron 1.53.3 stack for the adversarial client crash/stall suite in systests/adversarial/client-crash
# (AERON_E2E=1 AERON_ADVERSARIAL=1). The tests SIGKILL/SIGSTOP Go and Java client processes against this driver,
# and SIGSTOP/kill and recreate the driver itself, so it is separate from every other stack:
#
#   adv-client-crash-driver  ArchivingMediaDriver, AERON_DIR=/dev/shm/aeron-adv-client-crash, client liveness 3s,
#                            archive control localhost:27110 stream 10, recording events localhost:27130, archive id 91.
#
#   docker compose -f docker/adversarial-client-crash.compose.yml up -d --build --wait
#   AERON_E2E=1 AERON_ADVERSARIAL=1 go test -count=1 -p 1 -v ./systests/adversarial/client-crash/
name: adv-client-crash
services:
  driver:
    build: .
    image: docker-archiving-driver
    container_name: adv-client-crash-driver
    network_mode: host
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    shm_size: 1g
    volumes:
      - /dev/shm:/dev/shm
    tmpfs:
      - /data/archive:uid=1000,gid=1000
    environment:
      AERON_PROPS: >-
        -Daeron.dir=/dev/shm/aeron-adv-client-crash
        -Daeron.dir.delete.on.start=true
        -Daeron.client.liveness.timeout=3000000000
        -Daeron.image.liveness.timeout=3000000000
        -Daeron.publication.unblock.timeout=4000000000
        -Daeron.publication.connection.timeout=2000000000
        -Daeron.publication.linger.timeout=1000000000
        -Daeron.timer.interval=100000000
        -Daeron.untethered.window.limit.timeout=1000000000
        -Daeron.untethered.resting.timeout=1000000000
        -Daeron.archive.dir=/data/archive/rec
        -Daeron.archive.dir.delete.on.start=true
        -Daeron.archive.control.channel=aeron:udp?endpoint=localhost:27110
        -Daeron.archive.control.stream.id=10
        -Daeron.archive.replication.channel=aeron:udp?endpoint=localhost:0
        -Daeron.archive.recording.events.enabled=true
        -Daeron.archive.recording.events.channel=aeron:udp?control-mode=dynamic|control=localhost:27130
        -Daeron.archive.id=91
        -Daeron.threading.mode=SHARED
        -Daeron.archive.threading.mode=SHARED
    command: ["io.aeron.archive.ArchivingMediaDriver"]
    healthcheck:
      test: ["CMD", "test", "-f", "/dev/shm/aeron-adv-client-crash/cnc.dat"]
      interval: 1s
      retries: 30
